name: DarkReader
options:
  bundleIdPrefix: com.ipadark
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 2
packages:
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    from: 3.11.1
targets:
  DarkReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    scheme:
      testTargets:
        - DarkReaderTests
    info:
      path: BuildSupport/DarkReader-Info.plist
      properties:
        CFBundleDisplayName: Dark Reader
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        BGTaskSchedulerPermittedIdentifiers:
          - com.ipadark.reader.sync
        UIBackgroundModes:
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipadark.reader
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator

  DarkReaderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    dependencies:
      - target: DarkReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ipadark.reader.tests
        CODE_SIGNING_ALLOWED: NO
