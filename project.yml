name: DarkReader
options:
  bundleIdPrefix: com.ipadark
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 13
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 10.1.0
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    from: 3.11.1
  ZIPFoundation:
    url: https://github.com/readium/ZIPFoundation.git
    from: 3.0.1
targets:
  DarkReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - Resources
    scheme:
      testTargets:
        - DarkReaderTests
        - DarkReaderVisualTests
    info:
      path: BuildSupport/DarkReader-Info.plist
      properties:
        CFBundleDisplayName: "Dark Reader"
        CFBundleName: "Dark Reader - Books & Audiobooks"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "13"
        GIDClientID: "183748481353-7vbvbe3o7u1pgtg4vet7g3o86dg7lfsq.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.183748481353-7vbvbe3o7u1pgtg4vet7g3o86dg7lfsq
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Books and Audiobooks
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - public.zip-archive
              - org.idpf.epub-container
              - public.data
        UILaunchScreen: {}
        BGTaskSchedulerPermittedIdentifiers:
          - com.ipadark.reader.sync
        UIBackgroundModes:
          - fetch
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipadark.reader
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: ZIPFoundation
        product: ReadiumZIPFoundation

  DarkReaderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    dependencies:
      - target: DarkReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ipadark.reader.tests
        CODE_SIGNING_ALLOWED: NO

  DarkReaderVisualTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - VisualTests
    dependencies:
      - target: DarkReader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ipadark.reader.visualtests
        TEST_TARGET_NAME: DarkReader
        CODE_SIGNING_ALLOWED: NO
