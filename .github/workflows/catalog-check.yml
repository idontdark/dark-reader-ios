name: Check catalog APIs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/check_catalogs.py
      - .github/workflows/catalog-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe book catalog HTTP endpoints
        run: python3 scripts/check_catalogs.py
      - name: Upload API test evidence
        uses: actions/upload-artifact@v4
        with:
          name: catalog-api-report
          path: catalog-check.json
          if-no-files-found: error
