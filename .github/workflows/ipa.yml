name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project DarkReader.xcodeproj -scheme DarkReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/DarkReader.app"
          test -d "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry ../DarkReader-unsigned.ipa Payload)
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DarkReader-unsigned-ipa
          path: DarkReader-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
