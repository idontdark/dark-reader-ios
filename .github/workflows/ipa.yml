name: Build and publish IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: dark-reader-release
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate AppIcon.png
        run: swift scripts/generate_icon.swift
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project DarkReader.xcodeproj -scheme DarkReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO build
      - name: Verify and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/DarkReader.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/DarkReader"
          test -f "$APP/Assets.car"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          test "$VERSION" = "0.5.0"
          mkdir -p dist/Payload
          ditto "$APP" "dist/Payload/DarkReader.app"
          (cd dist && zip -qry ../DarkReader-0.5.0-unsigned.ipa Payload)
          unzip -tq DarkReader-0.5.0-unsigned.ipa
          unzip -Z1 DarkReader-0.5.0-unsigned.ipa | grep -qx 'Payload/DarkReader.app/Info.plist'
          unzip -Z1 DarkReader-0.5.0-unsigned.ipa | grep -qx 'Payload/DarkReader.app/DarkReader'
          echo "Verified Payload/DarkReader.app"
      - name: Upload Actions artifact (ZIP containing IPA)
        uses: actions/upload-artifact@v4
        with:
          name: DarkReader-IPA
          path: DarkReader-0.5.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dark Reader 0.5.0 build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Download the actual DarkReader-0.5.0-unsigned.ipa in the Assets section.
            Do not rename the Actions artifact ZIP to IPA. Unsigned IPA requires signing before installation.
          files: DarkReader-0.5.0-unsigned.ipa
