name: Build and publish IPA
on:
  workflow_dispatch:
concurrency:
  group: dark-reader-release
  cancel-in-progress: true
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache/restore@v4
        with:
          path: build
          key: iphone-derived-${{ runner.os }}-${{ hashFiles('project.yml') }}-${{ github.run_id }}
          restore-keys: iphone-derived-${{ runner.os }}-${{ hashFiles('project.yml') }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate AppIcon.png
        run: swift scripts/generate_icon.swift
      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          python3 scripts/stamp_build.py
      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project DarkReader.xcodeproj -scheme DarkReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO build
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build
          key: iphone-derived-${{ runner.os }}-${{ hashFiles('project.yml') }}-${{ github.run_id }}
      - name: Verify and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/DarkReader.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/DarkReader"
          test -f "$APP/Assets.car"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          test "$VERSION" = "1.0.0"
          mkdir -p dist/Payload
          ditto "$APP" "dist/Payload/DarkReader.app"
          mkdir -p release-files
          (cd dist && zip -qry '../release-files/dark-signer [v1.1].ipa' Payload)
          unzip -tq 'release-files/dark-signer [v1.1].ipa'
          unzip -Z1 'release-files/dark-signer [v1.1].ipa' > ipa-contents.txt
          grep -Fx 'Payload/DarkReader.app/Info.plist' ipa-contents.txt
          grep -Fx 'Payload/DarkReader.app/DarkReader' ipa-contents.txt
          echo "Verified Payload/DarkReader.app"
      - name: Upload Actions artifact (ZIP containing IPA)
        uses: actions/upload-artifact@v4
        with:
          name: dark-signer-v1.1-IPA
          path: release-files/*.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: Dark Reader — dark-signer [v1.1] (build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: false
          body_path: docs/RELEASE_UNIFIED_SOURCES.md
          files: release-files/*.ipa

      - name: Preserve requested installation filename
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v1.0.0-build-' + context.runNumber;
            const desired = 'dark-signer [v1.1].ipa';
            const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag});
            const asset = release.assets.find(a => a.name.endsWith('.ipa') && a.size > 0);
            if (!asset) throw new Error('IPA asset missing');
            if (asset.name !== desired) await github.rest.repos.updateReleaseAsset({...context.repo, asset_id: asset.id, name: desired, label: desired});
