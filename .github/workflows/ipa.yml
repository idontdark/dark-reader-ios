name: Build and publish IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: dark-reader-release
  cancel-in-progress: true
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate AppIcon.png
        run: swift scripts/generate_icon.swift
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build application
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project DarkReader.xcodeproj -scheme DarkReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO build
      - name: Verify and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/DarkReader.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/DarkReader"
          test -f "$APP/Assets.car"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          test "$VERSION" = "0.9.0"
          mkdir -p dist/Payload
          ditto "$APP" "dist/Payload/DarkReader.app"
          (cd dist && zip -qry ../DarkReader-0.9.0-unsigned.ipa Payload)
          unzip -tq DarkReader-0.9.0-unsigned.ipa
          unzip -Z1 DarkReader-0.9.0-unsigned.ipa | grep -qx 'Payload/DarkReader.app/Info.plist'
          unzip -Z1 DarkReader-0.9.0-unsigned.ipa | grep -qx 'Payload/DarkReader.app/DarkReader'
          echo "Verified Payload/DarkReader.app"
      - name: Upload Actions artifact (ZIP containing IPA)
        uses: actions/upload-artifact@v4
        with:
          name: DarkReader-0.9.0-IPA
          path: DarkReader-0.9.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.0-build-${{ github.run_number }}
          name: Dark Reader 0.9.0 — Новый дизайн (build ${{ github.run_number }})
          prerelease: true
          generate_release_notes: false
          body_path: docs/RELEASE_0.9.0.md
          files: DarkReader-0.9.0-unsigned.ipa

      - name: Remove superseded installation files
        uses: actions/github-script@v7
        with:
          script: |
            const current = 'v0.9.0-build-' + context.runNumber;
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const published = releases.find(r => r.tag_name === current && !r.draft && r.assets.some(a => a.name === 'DarkReader-0.9.0-unsigned.ipa' && a.state === 'uploaded' && a.size > 0));
            if (!published) throw new Error('New IPA not confirmed; keep old files');
            for (const release of releases.filter(r => r.id !== published.id)) {
              for (const asset of release.assets.filter(a => /^DarkReader.*\.(ipa|zip)$/i.test(a.name))) {
                await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: asset.id});
              }
            }
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page: 100});
            for (const artifact of artifacts.filter(a => /^DarkReader.*IPA$/i.test(a.name) && a.workflow_run?.id !== context.runId)) {
              await github.rest.actions.deleteArtifact({...context.repo, artifact_id: artifact.id});
            }
