name: Stop IPA builds
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/stop-ipa.yml']
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const status of ['queued', 'in_progress']) {
              const {data} = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id: 'ipa.yml', status, per_page: 100});
              for (const run of data.workflow_runs) {
                try { await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id}); }
                catch (error) { if (error.status !== 409) throw error; }
              }
            }
