name: Research 8 book and audiobook APIs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_sources.py
      - .github/workflows/source-research.yml
permissions:
  contents: read
jobs:
  source-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test eight services
        run: python3 scripts/probe_sources.py
