name: Validate iOS update
on:
  push:
    branches: [main, feature/unified-sources]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'project.yml'
      - 'scripts/catalog_regressions.swift'
      - 'scripts/core-regressions/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dark-reader-validation
  cancel-in-progress: true
jobs:
  catalog-tests:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run production catalog client regressions
        run: |
          swiftc -swift-version 5 -parse-as-library Sources/SourceCatalog.swift Sources/SourceCatalogGenerated.swift Sources/Book.swift Sources/GenreTaxonomy.swift Sources/SearchQueryPolicy.swift Sources/CatalogSearchAccumulator.swift Sources/OPDSClient.swift scripts/catalog_regressions.swift -o /tmp/catalog-regressions
          /tmp/catalog-regressions
  validate:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run real import and backup round trips on macOS
        run: |
          cp Sources/{SourceHTTPClient,SourceFileProbe,SourceHealthChecker,SearchQueryPolicy,CatalogSearchAccumulator,OPDSClient,CatalogProviders,FlibustaCatalog,HTMLSourceParser,BookSourceAdapters,AudioSourceAdapters,AudioModels,AudioCatalogService,AudioTrackCache,AudioWebCatalogModels,WebAudioSourceService,EditionIdentity,UnifiedSearchService,UnifiedDiscoveryService,RecommendationEngine,RecommendationProfile,DiscoveryModels,SourceCatalog,SourceCatalogGenerated,GenreTaxonomy,DocumentImport,Book,BookFormatConverter,FB2Document,BookMetadata,ReaderOptions,CloudLibraryModels,LocalLibraryBackup}.swift scripts/core-regressions/Harness/
          swift run --package-path scripts/core-regressions ReaderCoreRegressions
      - name: Prepare project
        run: |
          swift scripts/generate_icon.swift
          xcodegen generate --spec project.yml
          python3 scripts/stamp_build.py
      - name: Compile for iPhone without simulator or IPA packaging
        run: |
          set -o pipefail
          xcodebuild -project DarkReader.xcodeproj -scheme DarkReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { tail -n 160 build.log; exit 1; }
      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-compilation-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
