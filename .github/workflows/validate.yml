name: Validate iOS update
on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'project.yml'
      - 'scripts/catalog_regressions.swift'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dark-reader-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run catalog regressions without simulator
        run: |
          swiftc -swift-version 5 -parse-as-library Sources/Book.swift Sources/SearchQueryPolicy.swift Sources/OPDSClient.swift scripts/catalog_regressions.swift -o /tmp/catalog-regressions
          /tmp/catalog-regressions
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare project
        run: |
          swift scripts/generate_icon.swift
          xcodegen generate --spec project.yml
          python3 scripts/stamp_build.py
      - name: Compile for iPhone without simulator or IPA packaging
        run: |
          set -o pipefail
          xcodebuild -project DarkReader.xcodeproj -scheme DarkReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { tail -n 160 build.log; exit 1; }
      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-compilation-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
