name: Validate iOS update
on:
  push:
    branches: [main, feature/unified-sources]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Resources/**'
      - 'project.yml'
      - 'scripts/catalog_regressions.swift'
      - 'scripts/core-regressions/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dark-reader-validation
  cancel-in-progress: true
jobs:
  catalog-tests:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run production catalog client regressions
        run: |
          swiftc -swift-version 5 -parse-as-library Sources/SourceHTTPClient.swift Sources/SourceCatalog.swift Sources/SourceCatalogGenerated.swift Sources/Book.swift Sources/GenreTaxonomy.swift Sources/SearchQueryPolicy.swift Sources/CatalogSearchAccumulator.swift Sources/OPDSClient.swift scripts/catalog_regressions.swift -o /tmp/catalog-regressions
          /tmp/catalog-regressions
  validate:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache/restore@v4
        with:
          path: build
          key: iphone-derived-${{ runner.os }}-${{ hashFiles('project.yml') }}-${{ github.run_id }}
          restore-keys: iphone-derived-${{ runner.os }}-${{ hashFiles('project.yml') }}-
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: scripts/core-regressions/.build
          key: source-core-${{ runner.os }}-${{ hashFiles('scripts/core-regressions/Package.swift') }}
      - name: Run real import and backup round trips on macOS
        id: core-tests
        continue-on-error: true
        run: |
          cp Sources/{MediaDownloadState,SourceHTTPClient,SourceFileProbe,SourceHealthChecker,SearchQueryPolicy,CatalogSearchAccumulator,OPDSClient,CatalogProviders,FlibustaCatalog,HTMLSourceParser,BookSourceAdapters,AudioSourceAdapters,AudioModels,AudioCatalogService,AudioTrackCache,AudioWebCatalogModels,WebAudioSourceService,EditionIdentity,UnifiedSearchService,UnifiedDiscoveryService,RecommendationEngine,RecommendationProfile,DiscoveryModels,SourceCatalog,SourceCatalogGenerated,GenreTaxonomy,DocumentImport,Book,BookFormatConverter,FB2Document,BookMetadata,ReaderOptions,CloudLibraryModels,LocalLibraryBackup}.swift scripts/core-regressions/Harness/
          swift run --package-path scripts/core-regressions ReaderCoreRegressions
      - name: Prepare project
        run: |
          swift scripts/generate_icon.swift
          xcodegen generate --spec project.yml
          python3 scripts/stamp_build.py
      - name: Compile for iPhone without simulator or IPA packaging
        run: |
          set -o pipefail
          xcodebuild -project DarkReader.xcodeproj -scheme DarkReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { tail -n 160 build.log; exit 1; }
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build
          key: iphone-derived-${{ runner.os }}-${{ hashFiles('project.yml') }}-${{ github.run_id }}
      - name: Upload compilation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-compilation-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Require passing core regressions
        if: always() && steps.core-tests.outcome == 'failure'
        run: exit 1
  source-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: scripts/core-regressions/.build
          key: source-core-${{ runner.os }}-${{ hashFiles('scripts/core-regressions/Package.swift') }}
      - name: Audit real source adapters and genre metadata
        run: |
          cp Sources/{MediaDownloadState,SourceHTTPClient,SourceFileProbe,SourceHealthChecker,SearchQueryPolicy,CatalogSearchAccumulator,OPDSClient,CatalogProviders,FlibustaCatalog,HTMLSourceParser,BookSourceAdapters,AudioSourceAdapters,AudioModels,AudioCatalogService,AudioTrackCache,AudioWebCatalogModels,WebAudioSourceService,EditionIdentity,UnifiedSearchService,UnifiedDiscoveryService,RecommendationEngine,RecommendationProfile,DiscoveryModels,SourceCatalog,SourceCatalogGenerated,GenreTaxonomy,DocumentImport,Book,BookFormatConverter,FB2Document,BookMetadata,ReaderOptions,CloudLibraryModels,LocalLibraryBackup}.swift scripts/core-regressions/Harness/
          swift run --package-path scripts/core-regressions ReaderCoreRegressions --live-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-live-audit
          path: source-live-audit.json
          if-no-files-found: warn
          retention-days: 30
